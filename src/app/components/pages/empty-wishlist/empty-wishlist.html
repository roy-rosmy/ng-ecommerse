<div class="d-flex flex-column align-items-center justify-content-center py-5 text-center">
    <!-- Heart icon -->
    <div class="rounded-circle bg-light d-flex align-items-center justify-content-center mb-4" 
         style="width: 80px; height: 80px;">
        <mat-icon class="text-secondary" style="transform: scale(1.5);">favorite_border</mat-icon>
    </div>

    <!-- Message -->
    <h2 class="fw-bold text-dark mb-2">Your Wishlist is Empty</h2>
    <p class="text-secondary mb-4">Save items you love for later!</p>

    <!-- Start shopping button -->
    <button matButton="filled" routerLink="/products/all" class="px-4 py-2" style="min-width: 200px;">
        Start Shopping
    </button>
</div>
