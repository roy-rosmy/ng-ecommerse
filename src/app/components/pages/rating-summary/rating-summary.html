<div class="d-flex align-items-center gap-4 mb-4 p-4 bg-light rounded">
  <!-- Overall rating display -->
  <div class="d-flex flex-column align-items-center w-50">
    <div class="fs-1 fw-bold text-dark mb-1">
      {{ product().rating }}
    </div>

    <div class="d-flex align-items-center mb-2">
      <app-star-rating [rating]="product().rating"></app-star-rating>
    </div>

    <div class="small text-secondary">
      Based on {{ totalReviews() }} reviews
    </div>
  </div>

<div class="flex-grow-1">
  @for (breakdown of ratingBreakdown(); track breakdown.stars) {
    <div class="d-flex align-items-center gap-2 mb-2">
      
      <!-- Stars label -->
      <span class="small" style="width: 1rem;">
        {{ breakdown.stars }}★
      </span>

      <!-- Progress bar -->
      <div class="flex-grow-1 bg-light rounded-pill mx-2" style="height: 0.5rem;">
        <div
          class="bg-warning rounded-pill"
          style="height: 100%; transition: width 300ms ease;"
          [style.width.%]="breakdown.percentage">
        </div>
      </div>

      <!-- Count -->
      <span class="small text-secondary text-end" style="width: 2rem;">
        {{ breakdown.count }}
      </span>

    </div>
  }
</div>

</div>
