<mat-sidenav-container>
    <mat-sidenav mode="side" opened="true">
        <div class="p-4">
            <h2 class="fs-5 text-dark">Categories</h2>
            <mat-nav-list>
                @for (cat of categories(); track cat) {
                    <mat-list-item [activated]="cat == category()" class="my-2" [routerLink]="['/products', cat]">
                        <span matListItemTitle class="fw-medium" [class] ="cat === category() ? 'text-white' : null">
                            {{cat | titlecase}}
                        </span>
                    </mat-list-item>
                }
            </mat-nav-list>
        </div>
    </mat-sidenav>
    <mat-sidenav-content class="bg-light p-4 h-100">
        <h1 class="fs-2 fw-bold text-dark mb-1"> {{ category() | titlecase}}</h1>
        <p class="text-secondary mb-4">
            {{ store.filteredProducts().length }} products found
        </p>
        <div class="responsive-grid">
            @for (product of store.filteredProducts(); track product.id) {
            <app-products-card [product] = "product">
                 <app-toggle-wishlist [product]="product" [deleteProduct]="true"></app-toggle-wishlist>
            </app-products-card>
            }
        </div>
    </mat-sidenav-content>
</mat-sidenav-container>
