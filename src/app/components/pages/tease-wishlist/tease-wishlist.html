<div appViewPanel class="d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center gap-3">
        <mat-icon class="text-danger">favorite_border</mat-icon>
        <div>
            <h2 class="fs-4 fw-bold">Wishlist {{ store.wishlistCount() }}</h2>
            <p class="text-secondary small">You have {{ store.wishlistCount() }} items saved for later</p>
        </div>
    </div>
    <div class="d-flex align-items-center gap-3">
        <button matButton routerLink="/wishlist">View All</button>
        <button matButton="filled" class="d-flex align-items-center gap-2" (click)="store.addAllWishlistToCart()">
            <mat-icon>shopping_cart</mat-icon>
            Add All to Cart
        </button>
    </div>
</div>
